<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Watch Now</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  min-height: 100%;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #151515;
  color: white;
}
.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 35%,
      #5d4050 0%,
      #30232c 45%,
      #111111 100%);
}
.content {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
.play-button {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.85);
  background: rgba(255,255,255,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 35px rgba(255,255,255,.12);
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s ease;
}
.play-button:active {
  transform: scale(.94);
}
.play-icon {
  width: 0;
  height: 0;
  border-top: 19px solid transparent;
  border-bottom: 19px solid transparent;
  border-left: 29px solid white;
  margin-left: 7px;
}
.cta {
  margin-top: 24px;
  color: #fff;
  font-size: 27px;
  line-height: 1.5;
  font-weight: 700;
  text-decoration: none;
  text-shadow: 0 2px 10px #000;
}
.hint {
  margin-top: 8px;
  font-size: 15px;
  color: rgba(255,255,255,.85);
  line-height: 1.6;
}
.loading {
  font-size: 14px;
  color: rgba(255,255,255,.7);
  margin-top: 20px;
}
[hidden] {
  display: none !important;
}
</style>
</head>
<body>
<main class="page">
  <section class="content" id="content" dir="auto">
    <a class="play-button"
       id="playButton"
       href="https://t.co/EQHGRhNQmD"
       aria-label="Watch now">
      <span class="play-icon"></span>
    </a>
    <a class="cta"
       id="cta"
       href="https://adsone.leadseagle.shop/?utm_medium=b07afa9d20915a97366b408f9e9d8b131d53e139&utm_campaign=target_PH_1e33ce">
      Watch Now
    </a>
    <p class="hint" id="hint">
      Tap to continue
    </p>
    <p class="loading" id="loading">
      <!-- Language is selected automatically -->
    </p>
  </section>
</main>
<script>
(function () {
  const texts = {
    en: {
      title: "Watch Now",
      hint: "Tap to continue",
      lang: "en"
    },
    tl: {
      title: "Panoorin Ngayon",
      hint: "I-tap para magpatuloy",
      lang: "tl"
    },
    pt: {
      title: "Assista Agora",
      hint: "Toque para continuar",
      lang: "pt"
    },
    bn: {
      title: "এখনই দেখুন",
      hint: "চালিয়ে যেতে ট্যাপ করুন",
      lang: "bn"
    },
    ar: {
      title: "شاهد الآن فورًا 🫦",
      hint: "اضغط للمتابعة",
      lang: "ar"
    }
  };
  const arabCountries = new Set([
    "EG","SA","AE","KW","QA","BH","OM","JO","LB",
    "IQ","YE","SY","PS","SD","LY","TN","DZ","MA",
    "MR","SO","DJ","KM"
  ]);
  function getLanguage(country) {
    if (arabCountries.has(country)) return "ar";
    switch (country) {
      case "PH": return "tl";
      case "MZ": return "pt";
      case "BD": return "bn";
      case "ZM":
      case "ZW":
        return "en";
      default:
        return "en";
    }
  }
  function applyLanguage(language) {
    const t = texts[language] || texts.en;
    document.documentElement.lang = t.lang;
    document.documentElement.dir =
      language === "ar" || language === "bn" ? "rtl" : "ltr";
    document.getElementById("content").dir =
      language === "ar" || language === "bn" ? "rtl" : "ltr";
    document.getElementById("cta").textContent = t.title;
    document.getElementById("hint").textContent = t.hint;
    document.title = t.title;
  }
  // Default language if the country service is unavailable.
  applyLanguage("en");
  // Detect visitor country by IP, not browser language.
  fetch("https://ipwho.is/?fields=success,country_code")
    .then(function (response) {
      if (!response.ok) throw new Error("Country lookup failed");
      return response.json();
    })
    .then(function (data) {
      if (data && data.success && data.country_code) {
        applyLanguage(getLanguage(data.country_code.toUpperCase()));
      }
    })
    .catch(function () {
      // Keep English if IP detection is unavailable.
      applyLanguage("en");
    });
})();
</script>
</body>
</html>
