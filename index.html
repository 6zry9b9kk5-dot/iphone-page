<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Watch Now</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
    }

    .watch-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 280px;
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      color: #111111;

      border-radius: 45px;

      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;

      text-decoration: none;

      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);

      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .watch-button:active {
      transform: translate(-50%, -50%) scale(0.94);
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="background"
      src="./IMG_5656.jpeg"
      alt=""
    >

    <div class="overlay"></div>

    <a
      class="watch-button"
      href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
    >
      Watch Now
    </a>

  </main>

</body>
</html>
