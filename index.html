<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Watch Now</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 150px;
      height: 52px;
      padding: 0 28px;

      border: none;
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.96);
      color: #111;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;

      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.35);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="background"
      src="https://raw.githubusercontent.com/6zry9b9kk5-dot/iphone-page/main/IMG_5656.jpeg"
      alt=""
    >

    <a
      class="button"
      href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
    >
      Watch Now
    </a>

  </main>

</body>
</html>
