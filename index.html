
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09060d">
<title> </title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 min-height:100%;
 width:100%;
}

body{
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:15px;
 background:
 radial-gradient(ellipse at 50% 0%,#51204e 0%,transparent 48%),
 radial-gradient(ellipse at 100% 100%,#35102f 0%,transparent 45%),
 #09060d;
}

.container{
 width:100%;
 max-width:420px;
}

.card{
 padding:15px;
 border-radius:25px;
 background:linear-gradient(145deg,#241327,#120d17);
 border:1px solid #63385f;
 box-shadow:0 15px 45px #0009,0 0 30px #9b287c25;
}

.preview{
 width:100%;
 aspect-ratio:1/1;
 position:relative;
 overflow:hidden;
 border-radius:18px;
 background:#160d19;
}

.preview img{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 filter:blur(27px) brightness(.55) saturate(.8);
 transform:scale(1.2);
}

#screenLink{
 position:fixed;
 inset:0;
 z-index:9999;
 display:block;
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
}
</style>
</head>

<body>

<div class="container">

 <div class="card">
  <div class="preview">
   <img
    id="previewImage"
    src="./IMG_6344.jpeg"
    alt=""
   >
  </div>
 </div>

</div>

<a
 id="screenLink"
 href="https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7"
 aria-label="Continue"
></a>

<script>

const smartLink =
"https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";

document.getElementById("screenLink").href=smartLink;

setTimeout(()=>{
 window.location.href=smartLink;
},3000);

</script>

</body>
</html>
