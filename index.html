<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Now</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #12030b;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(20, 0, 12, 0.12),
          rgba(20, 0, 12, 0.42)
        ),
        url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1200&q=90")
        center center / cover no-repeat;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.05),
          rgba(0,0,0,0.16) 45%,
          rgba(0,0,0,0.50)
        );
    }

    .watch-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 245px;
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.97);
      color: #111;

      border-radius: 40px;

      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;

      text-decoration: none;

      box-shadow: 0 10px 35px rgba(0,0,0,0.50);

      -webkit-tap-highlight-color: transparent;
    }

    .watch-button:active {
      transform: translate(-50%, -50%) scale(0.93);
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="overlay"></div>

    <a
      class="watch-button"
      href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
    >
      Watch Now
    </a>

  </div>

</body>
</html>
