<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Now</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #12050d;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;

      /* خلفية رومانسية */
      background:
        linear-gradient(
          rgba(20, 0, 12, 0.25),
          rgba(20, 0, 12, 0.45)
        ),
        url("https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=90")
        center center / cover no-repeat;
    }

    /* طبقة سينمائية خفيفة */
    .shade {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.05) 0%,
          rgba(0,0,0,0.12) 45%,
          rgba(0,0,0,0.48) 100%
        );
    }

    /* زر Watch Now */
    .watch-button {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 240px;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      color: #111111;

      border-radius: 40px;

      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;

      text-decoration: none;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.45);

      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .watch-button:active {
      transform: translate(-50%, -50%) scale(0.93);
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="shade"></div>

    <a
      class="watch-button"
      href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
    >
      Watch Now
    </a>

  </div>

</body>
</html>
