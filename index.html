
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Watch Now</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      background:
        radial-gradient(ellipse at 50% 35%, #102c54 0%, transparent 58%),
        linear-gradient(180deg, #080b12 0%, #0b1322 100%);
      color: #fff;
      font-family: Arial, "Cairo", sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 460px;
      text-align: center;
      margin: auto;
    }

    .headline {
      margin: 0 0 20px;
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.5;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 18px rgba(39, 139, 255, 0.24);
    }

    .media {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 440px;
      overflow: hidden;
      border-radius: 22px;
      background: #10213a;
      border: 1px solid rgba(89, 169, 255, 0.48);
      box-shadow:
        0 0 32px rgba(0, 112, 255, 0.19),
        0 18px 50px rgba(0, 0, 0, 0.4);
      isolation: isolate;
    }

    .preview-image {
      position: absolute;
      inset: -14px;
      width: calc(100% + 28px);
      height: calc(100% + 28px);
      object-fit: cover;
      object-position: center;
      filter: blur(15px) brightness(0.52);
      transform: scale(1.03);
    }

    .media-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(4, 12, 25, 0.06), rgba(4, 12, 25, 0.42)),
        radial-gradient(circle, rgba(17, 91, 177, 0.12), rgba(3, 10, 22, 0.35));
      pointer-events: none;
    }

    .play-link {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 116px;
      height: 116px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      background: rgba(6, 21, 42, 0.74);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 0 0 9px rgba(255, 255, 255, 0.09),
        0 0 35px rgba(41, 145, 255, 0.55);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease, background 0.18s ease;
      z-index: 2;
    }

    .play-link:active {
      transform: translate(-50%, -50%) scale(0.95);
      background: rgba(16, 65, 119, 0.9);
    }

    .play-triangle {
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 23px solid #fff;
      filter: drop-shadow(0 1px 5px rgba(0, 0, 0, 0.3));
    }

    .countdown {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #fff;
    }

    .media-caption {
      position: absolute;
      bottom: 18px;
      left: 12px;
      right: 12px;
      color: #fff;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 700;
      text-shadow: 0 2px 8px #000;
      pointer-events: none;
      z-index: 1;
    }

    .watch-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin-top: 22px;
      padding: 14px 18px;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(135deg, #1687ff 0%, #0754d8 100%);
      box-shadow: 0 8px 25px rgba(0, 103, 255, 0.27);
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.18s ease, filter 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .watch-button:active {
      transform: scale(0.98);
      filter: brightness(1.1);
    }

    .footer-text {
      margin: 15px 0 0;
      color: rgba(225, 235, 250, 0.62);
      font-size: 12px;
      line-height: 1.6;
    }

    [dir="rtl"] {
      font-family: "Cairo", Arial, sans-serif;
    }

    @media (max-width: 360px) {
      .play-link {
        width: 100px;
        height: 100px;
      }

      .headline {
        font-size: 22px;
      }

      .watch-button {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="headline" id="headline">Watch Now</h1>

    <section class="media" aria-label="Video preview">
      <img
        class="preview-image"
        src="./IMG_6092.gif"
        alt=""
        fetchpriority="high"
      >

      <div class="media-shade"></div>

      <a
        class="play-link"
        id="playLink"
        href="https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&amp;utm_campaign=cr7"
        rel="nofollow sponsored"
        aria-label="Continue to the offer"
      >
        <span class="play-triangle" aria-hidden="true"></span>
        <span class="countdown" id="countdown">3</span>
      </a>

      <div class="media-caption" id="mediaCaption">
        Tap to continue
      </div>
    </section>

    <a
      class="watch-button"
      id="watchButton"
      href="https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&amp;utm_campaign=cr7"
      rel="nofollow sponsored"
    >
      Watch Now
    </a>

    <p class="footer-text" id="footerText">
      Tap the button to continue.
    </p>
  </main>

  <script>
    const offerUrl =
      "https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";

    const copy = {
      en: {
        title: "Watch Now",
        button: "Watch Now",
        caption: "Tap to continue",
        ready: "Ready to watch!",
        footer: "Tap the button to continue.",
        aria: "Continue to the offer"
      },

      fil: {
        title: "Manood Ngayon",
        button: "Manood Ngayon",
        caption: "Pindutin para magpatuloy",
        ready: "Handa ka nang manood!",
        footer: "Pindutin ang button para magpatuloy.",
        aria: "Magpatuloy sa offer"
      },

      pt: {
        title: "Assistir Agora",
        button: "Assistir Agora",
        caption: "Toque para continuar",
        ready: "Pronto para assistir!",
        footer: "Toque no botão para continuar.",
        aria: "Continuar para a oferta"
      },

      bn: {
        title: "এখনই দেখুন",
        button: "এখনই দেখুন",
        caption: "চালিয়ে যেতে চাপ দিন",
        ready: "দেখার জন্য প্রস্তুত!",
        footer: "চালিয়ে যেতে বোতামে চাপ দিন।",
        aria: "অফারে এগিয়ে যান"
      },

      ar: {
        title: "شاهد الآن",
        button: "شاهد الآن",
        caption: "اضغط للمتابعة",
        ready: "جاهز للمشاهدة!",
        footer: "اضغط على الزر للمتابعة.",
        aria: "المتابعة إلى العرض"
      }
    };

    const arabicCountries = [
      "EG", "SA", "AE", "KW", "QA", "BH", "OM",
      "JO", "IQ", "LB", "SY", "YE", "PS", "DZ",
      "MA", "TN", "LY", "SD", "MR", "SO", "DJ", "KM"
    ];

    function applyLanguage(language) {
      const selected = copy[language] || copy.en;

      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

      document.getElementById("headline").textContent = selected.title;
      document.getElementById("watchButton").textContent = selected.button;
      document.getElementById("mediaCaption").textContent = selected.caption;
      document.getElementById("footerText").textContent = selected.footer;
      document.getElementById("playLink").setAttribute("aria-label", selected.aria);

      return selected;
    }

    async function detectLanguage() {
      try {
        const response = await fetch("https://ipapi.co/json/", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Country lookup failed");
        }

        const data = await response.json();
        const country = (data.country_code || "").toUpperCase();

        if (country === "PH") return "fil";
        if (country === "MZ") return "pt";
        if (country === "BD") return "bn";
        if (arabicCountries.includes(country)) return "ar";

        return "en";
      } catch (error) {
        return "en";
      }
    }

    async function initializePage() {
      const language = await detectLanguage();
      const selected = applyLanguage(language);

      const countdown = document.getElementById("countdown");
      let seconds = 3;

      const timer = setInterval(() => {
        seconds--;

        if (seconds > 0) {
          countdown.textContent = String(seconds);
        } else {
          clearInterval(timer);
          countdown.textContent = "✓";
          document.getElementById("mediaCaption").textContent = selected.ready;
        }
      }, 1000);
    }

    document.getElementById("playLink").href = offerUrl;
    document.getElementById("watchButton").href = offerUrl;

    initializePage();
  </script>
</body>
</html>
