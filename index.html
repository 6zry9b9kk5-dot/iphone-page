<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تبي تستأنس وتتونس؟</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;

    /* نفس صورة البوست */
    bbackground-image:url("5AEF74AF-2125-4C6A-BED0-54F4E0599B7F.png");
    background-position:center top;
    background-size:cover;
    background-repeat:no-repeat;
    background-attachment:fixed;

    position:relative;
    color:#111;
}

/* طبقة خفيفة جدًا عشان الخلفية تفضل واضحة */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.03);
    z-index:0;
    pointer-events:none;
}

.wrap{
    position:relative;
    z-index:1;

    width:min(520px,78%);
    margin:auto;

    padding:48px 0 40px;
}

.box{
    background:rgba(255,255,255,.95);

    border:2px solid #111;

    box-shadow:
        0 5px 16px rgba(0,0,0,.25);

    padding:9px 11px;

    margin:0 auto 13px;

    text-align:center;

    border-radius:4px;
}

.title{
    font-size:clamp(19px,4.8vw,30px);

    font-weight:900;

    line-height:1.35;

    margin:0;
}

.subtitle{
    font-size:clamp(16px,4vw,24px);

    font-weight:800;

    line-height:1.4;

    margin:0;
}

.fire{
    font-size:25px;

    letter-spacing:4px;

    margin:0;
}

.cta{
    font-size:clamp(15px,3.7vw,22px);

    font-weight:900;

    line-height:1.4;

    margin:0;
}

/* زر التعرف على المزيد */
.more-box{
    padding:10px;
}

.more-button{
    display:block;

    width:100%;

    height:52px;

    border:0;

    border-radius:8px;

    background:#111;

    color:#fff;

    font-size:18px;

    font-weight:900;

    text-decoration:none;

    line-height:52px;

    cursor:pointer;

    box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.more-button:active{
    transform:scale(.98);
}


/* الموبايل */
@media(max-width:500px){

    .wrap{
        width:78%;
        padding-top:30px;
    }

    .box{
        margin-bottom:10px;
        padding:7px 8px;
    }

    .more-box{
        padding:8px;
    }

    .more-button{
        height:48px;
        line-height:48px;
        font-size:16px;
    }
}

</style>
</head>


<body>

<div class="wrap">


    <!-- السطر الأول -->
    <div class="box">

        <p class="title">
            انت تبي تستأنس وتتونس
        </p>

    </div>


    <!-- السطر الثاني -->
    <div class="box">

        <p class="subtitle">
            وتروق معه؟ 😉
        </p>

    </div>


    <!-- العروض -->
    <div class="box">

        <div class="fire">
            🔥 🔥 🔥
        </div>

        <p class="subtitle">
            في عروض مرا حريقة
        </p>

    </div>


    <!-- التعرف -->
    <div class="box">

        <p class="cta">
            اضغط التعرف على المزيد ودش قروب
        </p>

    </div>


    <!-- الواتساب -->
    <div class="box">

        <p class="cta">
            🔥 الواتساب لعندنا
        </p>

    </div>


    <!-- الزر فقط -->
    <div class="box more-box">

        <a
            class="more-button"
            href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
        >
            تعرّف على المزيد 🔥
        </a>

    </div>


</div>

</body>
</html>
