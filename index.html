<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
}
.page {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #111;
}
.background-gif {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    z-index: 0;
}
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.18);
    z-index: 1;
    pointer-events: none;
}
.watch-button {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 58px;
    padding: 16px 30px;
    max-width: 90%;
    border: none;
    border-radius: 50px;
    background: #ff1765;
    color: #fff;
    font-size: 21px;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 5px 25px rgba(255, 23, 101, .40);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease;
}
.watch-button:active {
    transform: scale(.96);
}
@media (max-width: 380px) {
    .watch-button {
        font-size: 18px;
        padding: 14px 22px;
    }
}
</style>
</head>
<body>
<main class="page">
    <img
        class="background-gif"
        src="IMG_6021.gif"
        alt=""
    >
    <div class="overlay"></div>
    <a
        class="watch-button"
        id="watchButton"
        href="https://t.co/EQHGRhNQmD"
        rel="nofollow sponsored"
    >
        <span id="buttonText">Watch Now</span>
        <span aria-hidden="true">🫦</span>
    </a>
</main>
<script>
(async function () {
    const buttonText = document.getElementById("buttonText");
    const translations = {
        PH: { lang: "fil", text: "Manood Na Ngayon" },
        KE: { lang: "en", text: "Watch Now" },
        BR: { lang: "pt-BR", text: "Assista Agora" },
        BD: { lang: "bn", text: "এখনই দেখুন" }
    };
    const arabicCountries = new Set([
        "EG", "SA", "AE", "KW", "QA", "BH", "OM",
        "JO", "LB", "IQ", "SY", "YE", "PS", "IL",
        "MA", "DZ", "TN", "LY", "SD", "SS", "MR",
        "SO", "DJ", "KM", "TD", "ER"
    ]);
    try {
        const response = await fetch(
            "https://ipapi.co/json/",
            { cache: "no-store" }
        );
        if (!response.ok) throw new Error("IP lookup failed");
        const data = await response.json();
        const country = (data.country_code || "").toUpperCase();
        if (translations[country]) {
            buttonText.textContent = translations[country].text;
            document.documentElement.lang = translations[country].lang;
            document.documentElement.dir = "ltr";
        } else if (arabicCountries.has(country)) {
            buttonText.textContent = "شاهد الآن فورًا";
            document.documentElement.lang = "ar";
            document.documentElement.dir = "rtl";
        } else {
            buttonText.textContent = "Watch Now";
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
        }
    } catch (error) {
        buttonText.textContent = "Watch Now";
        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";
    }
})();
</script>
</body>
</html>
