<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  overflow:hidden;
}

.page{
  width:100%;
  height:100vh;
  height:100dvh;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.48)
    ),
    url("IMG_5677.jpeg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

.overlay{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,.02) 0%,
      rgba(0,0,0,.45) 100%
    );
}

.content{
  position:relative;
  z-index:2;

  width:min(90%,500px);

  text-align:center;

  padding:30px 22px;

  border-radius:24px;

  background:rgba(0,0,0,.28);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

.badge{
  display:inline-block;

  padding:7px 16px;

  margin-bottom:18px;

  border-radius:30px;

  background:rgba(255,255,255,.15);

  border:1px solid rgba(255,255,255,.25);

  color:#fff;

  font-size:13px;

  font-weight:700;

  letter-spacing:.4px;
}

h1{
  color:#fff;

  font-size:clamp(28px,7vw,44px);

  line-height:1.15;

  margin-bottom:14px;

  text-shadow:
    0 3px 15px rgba(0,0,0,.7);
}

.description{
  color:rgba(255,255,255,.95);

  font-size:clamp(15px,4vw,18px);

  line-height:1.6;

  margin-bottom:25px;

  text-shadow:
    0 2px 10px rgba(0,0,0,.8);
}

.cta{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-width:220px;
  min-height:58px;

  padding:14px 28px;

  border-radius:40px;

  background:linear-gradient(
    135deg,
    #ff2d78,
    #9c27ff
  );

  color:#fff;

  text-decoration:none;

  font-size:18px;

  font-weight:800;

  box-shadow:
    0 10px 30px rgba(0,0,0,.45);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.cta:active{
  transform:scale(.96);
}

.loading{
  color:#fff;
  font-size:15px;
}

.hidden{
  display:none;
}

.rtl{
  direction:rtl;
}

.urdu{
  font-family:
    "Noto Nastaliq Urdu",
    "Noto Naskh Arabic",
    Arial,
    sans-serif;
}

@media(max-width:480px){

  .content{
    padding:25px 17px;
    border-radius:20px;
  }

  .cta{
    width:100%;
  }

}
</style>
</head>

<body>

<main class="page">

<div class="overlay"></div>

<section class="content" id="content">

<div class="loading" id="loading">
Loading...
</div>

<div id="mainContent" class="hidden">

<div class="badge" id="badge"></div>

<h1 id="title"></h1>

<p class="description" id="description"></p>

<a
  class="cta"
  id="cta"
  href="https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1"
  rel="nofollow"
></a>

</div>

</section>

</main>

<script>

const SMARTLINK =
"https://adsone.leadseagle.shop/?utm_medium=ad91ef12cbc61028dd54bd1f95ec531c80b2da20&utm_campaign=medoads1";


const countries = {

BD:{
  lang:"bn",
  direction:"rtl",
  badge:"18+",
  title:"আপনার জন্য কিছু বিশেষ আছে",
  description:"আরও দেখতে নিচের বাটনে ক্লিক করুন।",
  button:"আরও দেখুন"
},

PH:{
  lang:"fil",
  direction:"ltr",
  badge:"18+",
  title:"May espesyal para sa iyo",
  description:"I-click ang button sa ibaba para makita pa.",
  button:"Tingnan pa"
},

PK:{
  lang:"ur",
  direction:"rtl",
  badge:"18+",
  title:"آپ کے لیے کچھ خاص ہے",
  description:"مزید دیکھنے کے لیے نیچے والے بٹن پر کلک کریں۔",
  button:"مزید دیکھیں"
}

};


const fallback = {

lang:"en",
direction:"ltr",
badge:"18+",
title:"Welcome",
description:"Click below to continue.",
button:"Continue"

};


function renderPage(countryCode){

const data =
countries[countryCode] || fallback;

document.documentElement.lang =
data.lang;

const content =
document.getElementById("content");

content.classList.remove(
"rtl",
"urdu"
);

if(data.direction === "rtl"){
content.classList.add("rtl");
}

if(countryCode === "PK"){
content.classList.add("urdu");
}

document.getElementById("badge").textContent =
data.badge;

document.getElementById("title").textContent =
data.title;

document.getElementById("description").textContent =
data.description;

const button =
document.getElementById("cta");

button.textContent =
data.button;

button.href =
SMARTLINK;

document.getElementById("loading")
.classList.add("hidden");

document.getElementById("mainContent")
.classList.remove("hidden");

}


async function detectCountry(){

try{

const response =
await fetch(
"https://ipapi.co/json/",
{
method:"GET",
cache:"no-store"
}
);

if(!response.ok){
throw new Error("Geo API error");
}

const data =
await response.json();

const country =
String(
data.country_code || ""
)
.toUpperCase();

renderPage(country);

}catch(error){

renderPage(null);

}

}


detectCountry();

</script>

</body>
</html>
