
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081426">
<title>Something Special</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:22px 16px;
background:
radial-gradient(ellipse at 50% 25%,#164879 0%,transparent 60%),
linear-gradient(160deg,#060d19,#102440);
color:white;
font-family:Arial,"Cairo",sans-serif;
}

.page{
width:100%;
max-width:430px;
text-align:center;
}

.logo{
font-size:12px;
letter-spacing:4px;
font-weight:800;
color:#75baff;
margin-bottom:28px;
}

h1{
font-size:27px;
line-height:1.5;
margin:0 0 9px;
font-weight:800;
}

.description{
font-size:15px;
color:#b6cbe3;
margin:0 0 25px;
}

.preview{
position:relative;
width:100%;
aspect-ratio:1;
overflow:hidden;
border-radius:25px;
background:#132b49;
border:1px solid rgba(113,177,255,.5);
box-shadow:0 15px 55px rgba(0,0,0,.45);
}

.preview img{
position:absolute;
inset:-20px;
width:calc(100% + 40px);
height:calc(100% + 40px);
object-fit:cover;
filter:blur(19px) brightness(.43);
transform:scale(1.04);
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(3,13,27,.17);
}

.play{
width:100px;
height:100px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(14,79,145,.65);
border:2px solid white;
box-shadow:0 0 0 10px rgba(255,255,255,.09),
0 0 35px rgba(40,145,255,.45);
}

.triangle{
width:0;
height:0;
border-top:16px solid transparent;
border-bottom:16px solid transparent;
border-left:25px solid white;
margin-left:7px;
}

.caption{
position:absolute;
bottom:20px;
left:10px;
right:10px;
font-size:14px;
font-weight:700;
text-shadow:0 2px 8px black;
}

.status{
margin:23px 0 15px;
color:#a9c8ec;
font-size:14px;
}

.button{
width:100%;
min-height:59px;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
background:linear-gradient(120deg,#2695ff,#0755d5);
color:white;
font-size:17px;
font-weight:800;
text-decoration:none;
box-shadow:0 8px 25px rgba(0,100,255,.3);
}

.button.disabled{
opacity:.45;
}

.footer{
font-size:11px;
line-height:1.8;
color:#8298b4;
margin-top:19px;
}

[dir="rtl"]{
font-family:"Cairo",Arial,sans-serif;
}

@media(max-width:360px){
h1{font-size:23px}
.play{width:85px;height:85px}
}
</style>
</head>

<body>
<main class="page">

<div class="logo">DISCOVER</div>

<h1 id="title">There's Something Special Waiting for You 🫦</h1>

<p class="description" id="description">
Enjoy every moment.
</p>

<section class="preview">
<img src="./IMG_6092.gif" alt="Preview">

<div class="overlay">
<a class="play" id="playLink" href="#" aria-label="Continue">
<span class="triangle"></span>
</a>
</div>

<div class="caption" id="caption">Something special is waiting</div>
</section>

<div class="status" id="status">Please wait 3 seconds...</div>

<a class="button disabled" id="continue" href="#" aria-disabled="true">
<span id="buttonText">Continue (3)</span>
</a>

<p class="footer" id="footer">
Continue to view available offers.
</p>

</main>

<script>
const smartLink =
"https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";

const translations={
en:{
title:"There's Something Special Waiting for You 🫦",
description:"Enjoy every moment.",
caption:"Something special is waiting",
status:"Please wait",
button:"Continue",
footer:"Continue to view available offers."
},
sw:{
title:"Kuna Kitu Maalum Kinachokungoja 🫦",
description:"Furahia kila wakati.",
caption:"Kitu maalum kinakungoja",
status:"Tafadhali subiri",
button:"Endelea",
footer:"Endelea kuona ofa zinazopatikana."
},
pt:{
title:"Há Algo Especial Esperando por Você 🫦",
description:"Aproveite cada momento.",
caption:"Algo especial está esperando",
status:"Por favor aguarde",
button:"Continuar",
footer:"Continue para ver as ofertas disponíveis."
},
fil:{
title:"May Espesyal na Naghihintay sa Iyo 🫦",
description:"I-enjoy ang bawat sandali.",
caption:"May espesyal na naghihintay",
status:"Mangyaring maghintay",
button:"Magpatuloy",
footer:"Magpatuloy upang makita ang mga available na alok."
},
bn:{
title:"আপনার জন্য বিশেষ কিছু অপেক্ষা করছে 🫦",
description:"প্রতিটি মুহূর্ত উপভোগ করুন।",
caption:"বিশেষ কিছু অপেক্ষা করছে",
status:"অনুগ্রহ করে অপেক্ষা করুন",
button:"চালিয়ে যান",
footer:"উপলব্ধ অফার দেখতে চালিয়ে যান।"
},
id:{
title:"Ada Sesuatu yang Istimewa Menantimu 🫦",
description:"Nikmati setiap momen.",
caption:"Sesuatu yang istimewa menanti",
status:"Silakan tunggu",
button:"Lanjutkan",
footer:"Lanjutkan untuk melihat penawaran yang tersedia."
},
ur:{
title:"آپ کے لیے کچھ خاص منتظر ہے 🫦",
description:"ہر لمحے سے لطف اٹھائیں۔",
caption:"کچھ خاص آپ کا منتظر ہے",
status:"براہ کرم انتظار کریں",
button:"جاری رکھیں",
footer:"دستیاب آفرز دیکھنے کے لیے جاری رکھیں۔"
},
ar:{
title:"هناك شيء مميز بانتظارك 🫦",
description:"استمتع بكل لحظة.",
caption:"شيء مميز بانتظارك",
status:"يرجى الانتظار",
button:"متابعة",
footer:"تابع للاطلاع على العروض المتاحة."
}
};

const arabicCountries=[
"EG","SA","AE","KW","QA","BH","OM",
"JO","IQ","LB","SY","YE","PS","DZ",
"MA","TN","LY","SD","MR","SO","DJ","KM"
];

function languageFor(country){
if(arabicCountries.includes(country))return "ar";
if(country==="KE")return "sw";
if(country==="MZ")return "pt";
if(country==="PH")return "fil";
if(country==="BD")return "bn";
if(country==="ID")return "id";
if(country==="PK")return "ur";
return "en";
}

function applyLanguage(lang){
const c=translations[lang]||translations.en;

document.documentElement.lang=lang;
document.documentElement.dir=
(lang==="ar"||lang==="ur")?"rtl":"ltr";

document.getElementById("title").textContent=c.title;
document.getElementById("description").textContent=c.description;
document.getElementById("caption").textContent=c.caption;
document.getElementById("status").textContent=c.status;
document.getElementById("footer").textContent=c.footer;

return c;
}

async function start(){

let country="";

try{
const response=await fetch("https://ipapi.co/json/",{
cache:"no-store"
});
if(!response.ok)throw new Error("IP lookup failed");
const data=await response.json();
country=(data.country_code||"").toUpperCase();
}catch(e){}

const c=applyLanguage(languageFor(country));

const button=document.getElementById("continue");
const play=document.getElementById("playLink");
const buttonText=document.getElementById("buttonText");
const status=document.getElementById("status");

button.href=smartLink;
play.href=smartLink;

let seconds=3;

const timer=setInterval(()=>{
seconds--;

if(seconds>0){
buttonText.textContent=c.button+" ("+seconds+")";
}else{
clearInterval(timer);
status.textContent=c.button;
buttonText.textContent=c.button;
button.classList.remove("disabled");
button.removeAttribute("aria-disabled");
}
},1000);
}

start();
</script>
</body>
</html>
